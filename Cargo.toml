[package]
name = "zero2prod"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
path = "src/main.rs"
name = "zero2prod"

[dependencies]
actix-web = "4"
tokio = { version = "1.48.0", features = ["full"] }
log = "0.4.29"
serde = { version = "1.0.228", features = ["derive"] }

[dev-dependencies]
reqwest = "0.12.28"
